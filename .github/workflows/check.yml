name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Redis for isolated approval tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run check
      - run: npm run build
